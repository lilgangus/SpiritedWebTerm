<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostty</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="desktop">
        <div id="window">
            <div id="titlebar">
                <div id="traffic" aria-hidden="true">
                    <span class="close"></span>
                    <span class="min"></span>
                    <span class="max"></span>
                </div>
                <div id="tab">Ghostty</div>
                <div id="title">Ghostty</div>
            </div>
            <div id="term">
                <div id="screen-wrap">
                    <div id="screen" tabindex="0" role="application" aria-label="Terminal"></div>
                    <div id="cursor" aria-hidden="true"></div>
                    <div id="bell" aria-hidden="true"></div>
                </div>
                <div id="scrollbar" title="Scrollback" aria-label="Scrollback" role="scrollbar">
                    <div id="thumb"></div>
                </div>
                <div id="session-overlay">
                    <button type="button" id="open-session">Open Terminal</button>
                </div>
            </div>
            <pre id="boot-error"></pre>
        </div>
    </div>
    <style id="vt-palette"></style>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
