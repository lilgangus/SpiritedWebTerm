<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiritedWebTerm</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="desktop">
        <div id="snap-preview" aria-hidden="true"></div>
        <button type="button" id="desktop-new" hidden>New Window</button>
    </div>
    <pre id="boot-error" hidden></pre>

    <template id="window-template">
        <div class="window">
            <div class="titlebar">
                <div class="traffic" aria-hidden="true">
                    <button type="button" class="tl close" title="Close"></button>
                    <button type="button" class="tl min" title="Minimize"></button>
                    <div class="max-wrap">
                        <button type="button" class="tl max" title="Snap and full screen" aria-label="Snap and full screen"></button>
                        <div class="menu max-menu" hidden>
                            <button type="button" data-snap="max">Full Screen</button>
                            <button type="button" data-snap="left">Left</button>
                            <button type="button" data-snap="right">Right</button>
                            <div class="menu-item has-submenu">
                                <button type="button" data-snap="top">Top</button>
                                <div class="menu submenu" role="menu">
                                    <button type="button" data-snap="top-left">Top left</button>
                                    <button type="button" data-snap="top-right">Top right</button>
                                </div>
                            </div>
                            <div class="menu-item has-submenu">
                                <button type="button" data-snap="bottom">Bottom</button>
                                <div class="menu submenu" role="menu">
                                    <button type="button" data-snap="bottom-left">Bottom left</button>
                                    <button type="button" data-snap="bottom-right">Bottom right</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tabs">
                    <button type="button" class="tab-add" title="New tab" aria-label="New tab">+</button>
                </div>
                <button type="button" class="plus" title="New window" aria-label="New window">+</button>
                <div class="win-title">Ghostty</div>
            </div>
            <div class="panes"></div>
            <div class="resize-grip" aria-hidden="true"></div>
        </div>
    </template>

    <template id="tab-template">
        <button type="button" class="tab">
            <span class="tab-label">Ghostty</span>
            <span class="tab-close" title="Close tab" aria-label="Close tab">×</span>
        </button>
    </template>

    <template id="pane-template">
        <div class="pane">
            <div class="screen-wrap">
                <div class="screen" tabindex="0" role="application" aria-label="Terminal"></div>
                <div class="search-highlights" aria-hidden="true"></div>
                <div class="url-hover" aria-hidden="true" hidden></div>
                <div class="cursor" aria-hidden="true"></div>
                <div class="bell" aria-hidden="true"></div>
                <div class="search-overlay hidden">
                    <div class="search-bar">
                        <div class="search-field-wrap">
                            <input type="text" class="search-input" placeholder="Search" spellcheck="false" autocomplete="off" aria-label="Search">
                            <span class="search-count" aria-live="polite"></span>
                        </div>
                        <button type="button" class="search-prev" title="Previous match (⌘⇧G)" aria-label="Previous match">↑</button>
                        <button type="button" class="search-next" title="Next match (⌘G)" aria-label="Next match">↓</button>
                        <button type="button" class="search-close" title="Close (Esc)" aria-label="Close search">×</button>
                    </div>
                </div>
            </div>
            <div class="scrollbar" title="Scrollback" aria-label="Scrollback" role="scrollbar">
                <div class="thumb"></div>
            </div>
            <div class="session-overlay">
                <div class="session-actions">
                    <div class="session-actions-row">
                        <button type="button" class="open-session">New Terminal</button>
                        <button type="button" class="view-session" hidden>View Session</button>
                    </div>
                    <button type="button" class="close-session" hidden>Close Tab</button>
                </div>
            </div>
            <style class="vt-palette"></style>
        </div>
    </template>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
